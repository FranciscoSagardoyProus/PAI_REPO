<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Marques de text amb CSS encastat</title>

  <style type="text/css">
    body {font-family: Arial, Helvetica, sans-serif; }
    h1 { font-size: 1.6em; background-color: #CCC; font-family: cambria; font-weight: normal; }
    p { background-color: #CCC; }
    em {color: orange; background-color: #E8E8E8; }
    strong { color: red; background-color: #E8E8E8; }
    nav {font-variant-caps: all-small-caps; font-size: 20px; }
    nav ul li { display: inline; padding-left: 20px; }
    header {width: 20%; height: 100px; background-color: red; float: left;}
    nav {width: 80%; height: 100px; float: left; background-color: green; }
    div#primera {float: left; width: 30%; margin-right: 10px;}
    div#segona {float: left; width: 30%; margin-right: 10px;}
    div#tercera {float: left; width: 30%;}

  </style>
</head>
<body>
  <h1>Titular de nivell 1</h1>
  <p>En aquest paràgraf hi ha text marcat com <em>important</em> 
     i text marcat com a <strong>molt important</strong>.</p>
  <p>Aquest és el segon paràgraf.</p>
</body>
</html>
